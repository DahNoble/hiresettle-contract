name: Build and Size Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust target
      run: rustup target add wasm32v1-none
    - name: Build contract
      run: cargo build --manifest-path contracts/hiresettle/Cargo.toml --target wasm32v1-none --release
    - name: Check size
      run: |
        size=$(wc -c < target/wasm32v1-none/release/hiresettle.wasm)
        echo "Wasm size: $size bytes"
        # Budget is 500KB
        if [ "$size" -gt 512000 ]; then
          echo "Binary size exceeds 500KB limit!"
          exit 1
        fi
